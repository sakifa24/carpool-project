<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carpool - Login/Signup</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    

<div class="container">

  <h1>Carpool App</h1>

  <div class="tabs">
    <button id="loginTab" class="tab active">Login</button>
    <button id="signupTab" class="tab">Signup</button>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
    <p id="loginMessage" class="message"></p>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" class="hidden">
    <input type="text" id="signupUniversityId" placeholder="University ID" required>
    <input type="text" id="signupName" placeholder="Full Name" required>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="text" id="signupPhone" placeholder="Phone">
    <input type="password" id="signupPassword" placeholder="Password" required>
    <button type="submit">Sign Up</button>
    <p id="signupMessage" class="message"></p>
  </form>
</div>


    
</section>

<script src="script.js"></script>
</body>
</html>
